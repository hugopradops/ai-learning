<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugo AI Learning</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <header>
        <h1>Hugo AI Learning 🤖</h1>
    </header>
    <div class="container">
        <h2 class="welcome-message">Welcome to my AI assistant that is currently running in my basement 🤣</h2>
        <form id="promptForm">
            <label for="promptInput">Enter your prompt / Ask me anything:</label>
            <input type="text" id="promptInput" required>
            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="button" id="resetButton">Reset</button>
            </div>
        </form>
        <div id="responseContainer"></div>
    </div>
    <script src="server.js"></script>
    <script src="script.js"></script>
</body>
</html>
